# Extra env variables
# env = MY_GLOBAL_ENV,setting

# Multi-GPU: force the NVIDIA dGPU to be the PRIMARY render device.
# Your external monitor (DP-1) is wired to the dGPU (PCI 01:00.0). By default
# aquamarine picked the Intel iGPU (card2) as primary and copied every frame
# across PCIe to the dGPU for scanout -> choppy. Listing the dGPU first makes
# render + scanout happen on the same card. by-path symlinks are used because
# /dev/dri/cardN numbering is not stable across boots.
# dGPU = pci-0000:01:00.0 (nvidia), iGPU = pci-0000:00:02.0 (i915)
env = AQ_DRM_DEVICES,/dev/dri/by-path/pci-0000:01:00.0-card:/dev/dri/by-path/pci-0000:00:02.0-card
