# See https://wiki.hyprland.org/Configuring/Monitors/
# Monitors are managed directly here (hyprdynamicmonitors removed).
# Format: monitor = NAME, RESOLUTION@HZ, POSITION, SCALE

# Laptop panel
# monitor = eDP-1, 1920x1080@144.02, 0x0, 1
monitor = eDP-1, disable
monitor = eDP-2, disable

# External ultrawide: enabled to the rightq of the laptop when plugged in.
# To turn it OFF, change the next line to:  monitor = DP-1, disable
monitor = DP-1, 3440x1440@100, 1920x0, 1
# monitor = DP-1, disable, 1920x0, 1

# Fallback for any other / unknown display
monitor = , preferred, auto, 1

env = GDK_SCALE,1
